<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Manfred Scheucher</title>
  <meta name="description" content="Manfred Scheucher" />
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="mystyle.css">
  <link rel="stylesheet" href="bg-anim.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <nav class="nav" aria-label="Main navigation">
      <div class="brand">
        <img src="files/ich1.jpg" alt="Picture of Manfred Scheucher" />
        <h1>Manfred Scheucher</h1>
      </div>
      <div class="right">
        <button class="theme" id="themeBtn" aria-label="Toggle theme">Light</button>
      </div>
    </nav>
  </header>

  <main id="main" class="wrap layout">

    <!-- Left sidebar: tab navigation -->
    <nav class="tab-nav" aria-label="Sections">
      <button class="tab-btn active" data-tab="about">About</button>
      <button class="tab-btn" data-tab="blog">Blog</button>
      <button class="tab-btn" data-tab="hobby-projects">Current projects</button>
      <button class="tab-btn" data-tab="academic-software">Academic software</button>
      <button class="tab-btn" data-tab="publications">Publications</button>
      <button class="tab-btn" data-tab="preprints">Preprints</button>
      <button class="tab-btn" data-tab="theses">Theses</button>
      <button class="tab-btn" data-tab="talks">Talks</button>
      <button class="tab-btn" data-tab="terms-privacy">Terms &amp; privacy</button>
    </nav>

    <!-- Right content area -->
    <div class="tab-content">

      <section id="about" class="tab-panel box shadow active" aria-labelledby="about-h">
        <div data-include="about.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

      <section id="hobby-projects" class="tab-panel box shadow" aria-labelledby="hobby-projects-h">
        <h2 id="hobby-projects-h">Current projects</h2>
        <div data-include="hobby-projects.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

      <section id="academic-software" class="tab-panel box shadow" aria-labelledby="academic-software-h">
        <h2 id="academic-software-h">Academic software</h2>
        <div data-include="academic-software.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

      <section id="blog" class="tab-panel box shadow" aria-labelledby="blog-h">
        <h2 id="blog-h">Blog</h2>
        <div data-include="blog.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

      <section id="preprints" class="tab-panel box shadow" aria-labelledby="preprints-h">
        <h2 id="preprints-h">Preprints</h2>
        <div data-include="preprints.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

      <section id="publications" class="tab-panel box shadow" aria-labelledby="publications-h">
        <h2 id="publications-h">Publications</h2>
        <div data-include="publications.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

      <section id="theses" class="tab-panel box shadow" aria-labelledby="theses-h">
        <h2 id="theses-h">Theses</h2>
        <div data-include="theses.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

      <section id="talks" class="tab-panel box shadow" aria-labelledby="talks-h">
        <h2 id="talks-h">Talks</h2>
        <div data-include="talks.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

      <section id="terms-privacy" class="tab-panel box shadow" aria-labelledby="terms-privacy-h">
        <h2 id="terms-privacy-h">Terms &amp; privacy</h2>
        <div data-include="terms-privacy.html">
          <p class="meta">Loading…</p>
        </div>
      </section>

    </div>
  </main>

  <script>
    // obfuscate email
    function setEmailLink(){
      var u = "manfred.scheucher"; var d = "proton.me"; var e = u + "@" + d;
      var a = document.getElementById('emailLink');
      if(a){ a.href = 'mailto:' + e; a.textContent = "Email"; }
    }
    setEmailLink();

    // Theme toggle (light/dark)
    (function(){
      var KEY = 'theme-pref';
      var btn = document.getElementById('themeBtn');
      function apply(mode){
        var m = (mode === 'dark') ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', m);
        if(btn){
          btn.textContent = (m === 'dark') ? 'Switch to Light Mode' : 'Switch to Dark Mode';
          btn.setAttribute('aria-pressed', (m === 'dark'));
          btn.title = btn.textContent;
        }
      }
      var pref = localStorage.getItem(KEY);
      if(pref !== 'dark' && pref !== 'light'){ pref = 'light'; }
      apply(pref);
      if(btn){
        btn.addEventListener('click', function(){
          pref = (pref === 'light') ? 'dark' : 'light';
          localStorage.setItem(KEY, pref);
          apply(pref);
        });
      }
    })();

    // Tab switching
    (function(){
      var btns = document.querySelectorAll('.tab-btn');
      var panels = document.querySelectorAll('.tab-panel');

      function activate(id){
        btns.forEach(function(b){ b.classList.toggle('active', b.dataset.tab === id); });
        panels.forEach(function(p){ p.classList.toggle('active', p.id === id); });
        history.replaceState(null, '', '#' + id);
      }

      btns.forEach(function(btn){
        btn.addEventListener('click', function(){ activate(btn.dataset.tab); });
      });

      var valid = ['about','blog','hobby-projects','academic-software','publications','preprints','theses','talks','terms-privacy'];

      // A hash names either a tab or an element inside a tab (e.g. a blog post).
      function goTo(h, scroll){
        if(valid.indexOf(h) !== -1){ activate(h); if(scroll) window.scrollTo(0, 0); return; }
        var el = document.getElementById(h);
        var panel = el && el.closest('.tab-panel');
        if(panel){ activate(panel.id); history.replaceState(null, '', '#' + h); el.scrollIntoView(); }
      }

      // Restore from hash; the includes below call this again once their content is there
      window.goToHash = function(){ goTo(window.location.hash.replace('#',''), false); };
      window.goToHash();

      // in-page links like <a href="#publications"> switch the tab
      window.addEventListener('hashchange', function(){
        goTo(window.location.hash.replace('#',''), true);
      });
    })();

    // Client-side includes
    (function(){
      var nodes = document.querySelectorAll('[data-include]');
      nodes.forEach(function(el){
        var url = el.getAttribute('data-include');
        if(!url) return;
        fetch(url, {cache: 'no-cache'})
          .then(function(res){
            if(!res.ok) throw new Error(res.status);
            return res.text();
          })
          .then(function(html){
            el.innerHTML = html;
            try { setEmailLink(); window.goToHash(); } catch(_) {}
          })
          .catch(function(err){
            el.innerHTML = '<p class="meta">Could not load <code>'+url+'</code> ('+err.message+').</p>';
          });
      });
    })();
  </script>
</body>
</html>
